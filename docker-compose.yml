version: '3.8'

services:
  w9-daily-reminders:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: w9-daily-reminders
    restart: unless-stopped
    ports:
      - "${W9_REMINDERS_PORT:-8084}:8084"
    environment:
      - PORT=8084
      - DATABASE_URL=${DATABASE_URL:-postgres://w9_admin:password@w9-postgres:5432/w9_reminders}
      - W9_MAIL_API_BASE=${W9_MAIL_API_BASE:-https://mail.w9.nu/api}
      - W9_MAIL_SERVICE_TOKEN=${W9_REMINDERS_MAIL_SERVICE_TOKEN:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://reminder.w9.nu/google/callback}
      - POLLINATIONS_API_KEY=${POLLINATIONS_API_KEY:-}
      - POLLINATIONS_API_BASE=${POLLINATIONS_API_BASE:-https://enter.pollinations.ai}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CLOUDFLARE_AI_BASE=${CLOUDFLARE_AI_BASE:-https://api.cloudflare.com/client/v4}
      - RUST_LOG=${W9_REMINDERS_RUST_LOG:-w9_daily_reminders=info,axum=info}
    volumes:
      - w9-reminders-data:/app/data
    networks:
      - w9-labs_default
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8084/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  w9-reminders-data:
    driver: local

networks:
  w9-labs_default:
    external: true
