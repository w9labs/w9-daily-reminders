version: '3.8'
services:
  w9-daily-reminders:
    image: ghcr.io/${GITHUB_USER:-w9labs}/w9-daily-reminders:latest
    container_name: w9-daily-reminders
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.w9-reminders.rule=Host(`reminder.w9.nu`)"
      - "traefik.http.routers.w9-reminders.entrypoints=websecure"
      - "traefik.http.routers.w9-reminders.tls=true"
      - "traefik.http.services.w9-reminders.loadbalancer.server.port=8084"
    ports:
      - "${W9_REMINDERS_PORT:-8084}:8084"
    environment:
      - HOST=0.0.0.0
      - PORT=8084
      - DATABASE_URL=${DATABASE_URL:-memory}
      - W9_MAIL_API_URL=${W9_MAIL_API_URL:-https://mail.w9.nu}
      - W9_MAIL_API_TOKEN=${W9_MAIL_API_TOKEN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    volumes:
      - w9-reminders-data:/app/data
    networks:
      - w9-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8084/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  watchtower:
    image: containrrr/watchtower:latest
    container_name: w9-reminders-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_LABEL_ENABLE=true
    command: --interval 300 --scope w9-daily-reminders
    networks:
      - w9-network
volumes:
  w9-reminders-data:
    driver: local
networks:
  w9-network:
    external: true
