version: '3.8'

services:
  # W9 Daily Reminders Backend
  w9-daily-reminders-backend:
    image: ghcr.io/${GITHUB_USER:-your-username}/w9-daily-reminders-backend:latest
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "${W9_REMINDERS_PORT:-8787}:8787"
    environment:
      - PORT=8787
      - DATA_DIR=/app/data
      - W9_MAIL_API_BASE=${W9_MAIL_API_BASE:-https://w9.nu/api}
      - W9_MAIL_SERVICE_TOKEN=${W9_REMINDERS_MAIL_SERVICE_TOKEN:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://reminder.w9.nu/google/callback}
      - TURNSTILE_SITE_KEY=${W9_REMINDERS_TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET=${W9_REMINDERS_TURNSTILE_SECRET:-}
      - POLLINATIONS_API_KEY=${POLLINATIONS_API_KEY:-}
      - POLLINATIONS_API_BASE=${POLLINATIONS_API_BASE:-https://enter.pollinations.ai}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CLOUDFLARE_AI_BASE=${CLOUDFLARE_AI_BASE:-https://api.cloudflare.com/client/v4}
      - RUST_LOG=${W9_REMINDERS_RUST_LOG:-w9_daily_reminders=info,axum=info}
    volumes:
      - w9-reminders-data:/app/data
    networks:
      - w9-reminders-network
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == worker
          # Optional: pin to specific nodes
          # - node.hostname == vps-8
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8787/api/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # W9 Daily Reminders Frontend
  w9-daily-reminders-frontend:
    image: ghcr.io/${GITHUB_USER:-your-username}/w9-daily-reminders-frontend:latest
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "${W9_REMINDERS_FRONTEND_PORT:-8083}:80"
    networks:
      - w9-reminders-network
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == worker

  # Watchtower - Auto-update containers
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_LABEL_ENABLE=true
    command: --interval 300 --scope w9-daily-reminders-backend w9-daily-reminders-frontend
    networks:
      - w9-reminders-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

volumes:
  w9-reminders-data:
    driver: local

networks:
  w9-reminders-network:
    driver: overlay

